<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR kod yaratish</title>
<style>body{font:16px system-ui,sans-serif;max-width:420px;margin:0 auto;padding:20px;text-align:center}input{width:100%;height:46px;border:1px solid #ccc;border-radius:12px;padding:0 12px;font:inherit}#q{margin:20px auto;display:inline-block;padding:14px;background:#fff;border:1px solid #ddd;border-radius:16px}a{display:block;margin-top:10px;padding:14px;border-radius:12px;background:#0e9f78;color:#fff;text-decoration:none;font-weight:700}</style></head>
<body><h2>Ilova uchun QR kod</h2><p>Saytingiz manzilini yozing:</p><input id="u" inputmode="url" placeholder="https://sizning-saytingiz.netlify.app">
<div id="q"></div><a id="d" download="qr-kod.png">PNG qilib saqlash</a>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var u=document.getElementById("u"),q=document.getElementById("q"),d=document.getElementById("d");
if(/^https?:/.test(location.protocol))u.value=location.href.replace(/qr\.html.*$/,"");
function mk(){q.innerHTML="";if(!u.value.trim())return;new QRCode(q,{text:u.value.trim(),width:280,height:280,correctLevel:QRCode.CorrectLevel.M});
setTimeout(function(){var c=q.querySelector("canvas");if(c)d.href=c.toDataURL("image/png")},150)}
u.addEventListener("input",mk);mk();
</script></body></html>
